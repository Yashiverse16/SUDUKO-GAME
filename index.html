<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Sudoku - Premium Mind Game</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="title-container">
        <h1>NEON<span>SUDOKU</span></h1>
        <p class="subtitle">Train your brain, visually stunning</p>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
          <!-- Moon Icon (Dark Mode is default) -->
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="moon-icon hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Game Area -->
    <main class="game-layout">
      <!-- Status bar -->
      <section class="status-bar">
        <div class="status-item difficulty-selector">
          <label for="difficulty-select">Difficulty:</label>
          <select id="difficulty-select" class="styled-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        
        <div class="status-item status-stats">
          <div class="stat-box" id="timer-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="timer-display">00:00</span>
          </div>
          <div class="stat-box" id="mistakes-box">
            <span class="label">Mistakes:</span>
            <span id="mistakes-display">0 / 3</span>
          </div>
        </div>
      </section>

      <!-- Sudoku Board & Interactive Grid -->
      <section class="board-container">
        <div id="sudoku-board" class="sudoku-board" tabindex="0">
          <!-- 81 cells will be injected programmatically by JS -->
        </div>
      </section>

      <!-- Controls Panel -->
      <section class="controls-panel">
        <button id="undo-btn" class="control-btn" aria-label="Undo last move" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          <span>Undo</span>
        </button>
        <button id="redo-btn" class="control-btn" aria-label="Redo move" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
          <span>Redo</span>
        </button>
        <button id="notes-btn" class="control-btn" aria-label="Toggle notes mode">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          <span>Notes: Off</span>
        </button>
        <button id="erase-btn" class="control-btn" aria-label="Erase number">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16c-1.5-1.5-1.5-3.5 0-5l7-7c1.5-1.5 3.5-1.5 5 0l5 5c1.5 1.5 1.5 3.5 0 5L17 18Z"/><path d="M22 22H2"/></svg>
          <span>Erase</span>
        </button>
        <button id="hint-btn" class="control-btn" aria-label="Get a hint">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
          <span>Hint</span>
        </button>
      </section>

      <!-- Virtual Number Keypad (For mobile/mouse clicks) -->
      <section class="number-keypad">
        <button class="key-btn" data-value="1">1</button>
        <button class="key-btn" data-value="2">2</button>
        <button class="key-btn" data-value="3">3</button>
        <button class="key-btn" data-value="4">4</button>
        <button class="key-btn" data-value="5">5</button>
        <button class="key-btn" data-value="6">6</button>
        <button class="key-btn" data-value="7">7</button>
        <button class="key-btn" data-value="8">8</button>
        <button class="key-btn" data-value="9">9</button>
      </section>

      <!-- Game Actions -->
      <section class="game-actions">
        <button id="restart-btn" class="secondary-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          Restart
        </button>
        <button id="new-game-btn" class="primary-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          New Game
        </button>
      </section>
    </main>
  </div>

  <!-- Dialog / Modals -->
  <div id="victory-modal" class="modal-overlay hidden">
    <div class="modal-content glass-effect">
      <div class="modal-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
      </div>
      <h2>Victory!</h2>
      <p class="modal-message">You have successfully completed the Sudoku puzzle!</p>
      
      <div class="victory-stats">
        <div class="stat-detail">
          <span class="label">Difficulty</span>
          <span id="modal-difficulty" class="value">Medium</span>
        </div>
        <div class="stat-detail">
          <span class="label">Time</span>
          <span id="modal-time" class="value">05:42</span>
        </div>
        <div class="stat-detail">
          <span class="label">Mistakes</span>
          <span id="modal-mistakes" class="value">0 / 3</span>
        </div>
      </div>

      <button id="modal-new-game-btn" class="primary-btn w-full">Play Again</button>
    </div>
  </div>

  <div id="gameover-modal" class="modal-overlay hidden">
    <div class="modal-content glass-effect error-modal">
      <div class="modal-badge danger">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 22 2 22"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h2>Game Over</h2>
      <p class="modal-message">You've made 3 mistakes and lost this round.</p>
      
      <button id="modal-retry-btn" class="primary-btn w-full danger-btn">Try Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
